name = "ambifo"
main = "worker.js"
compatibility_date = "2024-04-10"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "public/static"

# KV Namespace for consultation enquiries
[[kv_namespaces]]
binding = "ambifo"
id = "9638d38af59d42b28c4b71710a917795"

# Routes configuration
[env.production]
name = "ambifo"
routes = [
  { pattern = "ambifo.cloud/*", zone_name = "ambifo.cloud" }
]
kv_namespaces = [
  { binding = "ambifo", id = "9638d38af59d42b28c4b71710a917795", preview_id = "9638d38af59d42b28c4b71710a917795" }
]

[env.staging]
name = "ambifo-staging"
kv_namespaces = [
  { binding = "ambifo", id = "9638d38af59d42b28c4b71710a917795", preview_id = "9638d38af59d42b28c4b71710a917795" }
]

# Analytics settings
[analytics]
enabled = true