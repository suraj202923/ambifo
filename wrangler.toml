name = "ambifo"
type = "javascript"
account_id = ""
workers_dev = true
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
vars = { ENVIRONMENT = "production" }

[build]
command = "npm run build"
cwd = "./"

[[routes]]
pattern = "example.com/*"
zone_id = ""

[[env.production.routes]]
pattern = "ambifo.tech/*"
zone_id = ""
